<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">L1ngSh1 — Security Researcher</title>
  <desc id="desc">A compact mobile version of the desktop research console, preserving the original identity and attack-surface layout.</desc>
  <defs>
