    <g class="label"><text x="164" y="127">AGENT SECURITY</text><text x="164" y="247">PROGRAM ANALYSIS</text><text x="164" y="367">VULNERABILITY EVALUATION</text><text x="164" y="447">OFFENSIVE SECURITY</text></g>
