<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Current research surface</title><desc id="desc">Four research domains arranged for a mobile display.</desc>
  <defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace}.node{fill:#161B22;stroke:#8B949E;stroke-width:2}.active{stroke:#DA3633}.label{fill:#C9D1D9;font-size:23px}.status{fill:#3FB950;font-size:17px;letter-spacing:1px}</style></defs>
  <rect width="720" height="520" rx="18" fill="#0D1117"/><rect x="1" y="1" width="718" height="518" rx="17" fill="none" stroke="#30363D"/>
