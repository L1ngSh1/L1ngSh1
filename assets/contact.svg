<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">TCP three-way handshake contact panel</title>
  <desc id="desc">A six-endpoint TCP rail shows SYN, SYN ACK, and ACK packets before the connection becomes established.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace; }
      .rail,.track { fill:none; stroke:#30363D; stroke-width:1.25; }
      .endpoint { fill:#0D1117; stroke:#8B949E; stroke-width:1.4; }
      .stage-label { fill:#8B949E; font-size:14px; letter-spacing:.6px; opacity:.52; }
      .arrow { fill:none; stroke:#8B949E; stroke-width:1.25; opacity:.55; }
      .packet { fill:#DA3633; stroke:#F85149; stroke-width:1; }
      .packet circle { opacity:0; }
      .established,.established-line,.established-text,.endpoint-status { opacity:0; }
      .established-line { stroke-dasharray:368; stroke-dashoffset:368; }
      @media (prefers-reduced-motion: reduce) {
        .packet { display:none; }
        .stage-label { fill:#E6EDF3 !important; opacity:1 !important; }
        .arrow { stroke:#8B949E !important; opacity:.55 !important; }
        .established,.established-line,.established-text,.endpoint-status { opacity:1 !important; transform:none !important; }
        .established-line { stroke-dashoffset:0 !important; }
      }
    </style>
  </defs>
  <rect width="1200" height="180" rx="14" fill="#0D1117"/>
  <rect x="1" y="1" width="1198" height="178" rx="13" fill="none" stroke="#30363D"/>
  <g class="mono">
    <text x="36" y="36" fill="#8B949E" font-size="17" letter-spacing=".8">TCP / THREE-WAY HANDSHAKE</text>
    <text x="36" y="88" fill="#E6EDF3" font-size="31" letter-spacing="1">ESTABLISH CONNECTION</text>
    <text class="established" x="36" y="126" fill="#3FB950" font-size="15" letter-spacing=".7">● CONNECTION ESTABLISHED<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.56;.6;1" begin="0s" dur="20s" repeatCount="indefinite"/></text>

    <g text-anchor="middle" fill="#8B949E" font-size="15" letter-spacing=".6">
      <text x="730" y="32">VISITOR</text>
      <text x="1110" y="32">L1NGSH1 NODE</text>
    </g>
    <path class="rail" d="M730 50V130M1110 50V130"/>
    <path class="track" d="M736 54H1104M736 90H1104M736 126H1104"/>

    <g class="endpoint">
      <circle cx="730" cy="54" r="6"><animate attributeName="stroke" values="#8B949E;#8B949E;#DA3633;#DA3633;#8B949E;#8B949E" keyTimes="0;0.095;0.1;0.11;0.12;1" begin="0s" dur="20s" repeatCount="indefinite"/><animate attributeName="r" values="6;6;7.25;6;6;6" keyTimes="0;0.095;0.1;0.11;0.12;1" begin="0s" dur="20s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="54" r="6"><animate attributeName="stroke" values="#8B949E;#8B949E;#DA3633;#DA3633;#8B949E;#8B949E" keyTimes="0;0.195;0.2;0.21;0.22;1" begin="0s" dur="20s" repeatCount="indefinite"/><animate attributeName="r" values="6;6;7.25;6;6;6" keyTimes="0;0.195;0.2;0.21;0.22;1" begin="0s" dur="20s" repeatCount="indefinite"/></circle>
      <circle cx="730" cy="90" r="6"><animate attributeName="stroke" values="#8B949E;#8B949E;#DA3633;#DA3633;#8B949E;#8B949E" keyTimes="0;0.345;0.35;0.36;0.37;1" begin="0s" dur="20s" repeatCount="indefinite"/><animate attributeName="r" values="6;6;7.25;6;6;6" keyTimes="0;0.345;0.35;0.36;0.37;1" begin="0s" dur="20s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="90" r="6"><animate attributeName="stroke" values="#8B949E;#8B949E;#DA3633;#DA3633;#8B949E;#8B949E" keyTimes="0;0.245;0.25;0.26;0.27;1" begin="0s" dur="20s" repeatCount="indefinite"/><animate attributeName="r" values="6;6;7.25;6;6;6" keyTimes="0;0.245;0.25;0.26;0.27;1" begin="0s" dur="20s" repeatCount="indefinite"/></circle>
      <circle cx="730" cy="126" r="6"><animate attributeName="stroke" values="#8B949E;#8B949E;#DA3633;#DA3633;#8B949E;#8B949E" keyTimes="0;0.395;0.4;0.41;0.42;1" begin="0s" dur="20s" repeatCount="indefinite"/><animate attributeName="r" values="6;6;7.25;6;6;6" keyTimes="0;0.395;0.4;0.41;0.42;1" begin="0s" dur="20s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="126" r="6"><animate attributeName="stroke" values="#8B949E;#8B949E;#DA3633;#DA3633;#8B949E;#8B949E" keyTimes="0;0.495;0.5;0.51;0.52;1" begin="0s" dur="20s" repeatCount="indefinite"/><animate attributeName="r" values="6;6;7.25;6;6;6" keyTimes="0;0.495;0.5;0.51;0.52;1" begin="0s" dur="20s" repeatCount="indefinite"/></circle>
    </g>

    <g class="stage-label" text-anchor="middle">
      <text x="920" y="49">SYN<animate attributeName="fill" values="#8B949E;#8B949E;#DA3633;#DA3633;#E6EDF3;#E6EDF3" keyTimes="0;0.095;0.1;0.2;0.21;1" begin="0s" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values=".52;.52;1;1;1;1" keyTimes="0;0.095;0.1;0.2;0.21;1" begin="0s" dur="20s" repeatCount="indefinite"/></text>
      <text x="920" y="85">SYN / ACK<animate attributeName="fill" values="#8B949E;#8B949E;#DA3633;#DA3633;#E6EDF3;#E6EDF3" keyTimes="0;0.245;0.25;0.35;0.36;1" begin="0s" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values=".52;.52;1;1;1;1" keyTimes="0;0.245;0.25;0.35;0.36;1" begin="0s" dur="20s" repeatCount="indefinite"/></text>
      <text x="920" y="121">ACK<animate attributeName="fill" values="#8B949E;#8B949E;#DA3633;#DA3633;#E6EDF3;#E6EDF3" keyTimes="0;0.395;0.4;0.5;0.51;1" begin="0s" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values=".52;.52;1;1;1;1" keyTimes="0;0.395;0.4;0.5;0.51;1" begin="0s" dur="20s" repeatCount="indefinite"/></text>
    </g>
    <g class="arrow">
      <path d="M1098 50l6 4-6 4"><animate attributeName="stroke" values="#8B949E;#8B949E;#DA3633;#DA3633;#8B949E;#8B949E" keyTimes="0;0.095;0.1;0.2;0.21;1" begin="0s" dur="20s" repeatCount="indefinite"/></path>
      <path d="M742 86l-6 4 6 4"><animate attributeName="stroke" values="#8B949E;#8B949E;#DA3633;#DA3633;#8B949E;#8B949E" keyTimes="0;0.245;0.25;0.35;0.36;1" begin="0s" dur="20s" repeatCount="indefinite"/></path>
      <path d="M1098 122l6 4-6 4"><animate attributeName="stroke" values="#8B949E;#8B949E;#DA3633;#DA3633;#8B949E;#8B949E" keyTimes="0;0.395;0.4;0.5;0.51;1" begin="0s" dur="20s" repeatCount="indefinite"/></path>
    </g>
    <g class="packet">
      <circle cy="54" r="4.5"><animate attributeName="cx" values="730;730;1110;1110" keyTimes="0;0.1;0.2;1" begin="0s" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.095;0.105;0.195;0.2;1" begin="0s" dur="20s" repeatCount="indefinite"/></circle>
      <circle cy="90" r="4.5"><animate attributeName="cx" values="1110;1110;730;730" keyTimes="0;0.25;0.35;1" begin="0s" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.245;0.255;0.345;0.35;1" begin="0s" dur="20s" repeatCount="indefinite"/></circle>
      <circle cy="126" r="4.5"><animate attributeName="cx" values="730;730;1110;1110" keyTimes="0;0.4;0.5;1" begin="0s" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.395;0.405;0.495;0.5;1" begin="0s" dur="20s" repeatCount="indefinite"/></circle>
    </g>

    <path class="established-line" d="M736 151H1104" fill="none" stroke="#3FB950" stroke-width="2"><animate attributeName="opacity" values="0;0;.8;.8" keyTimes="0;.55;.56;1" begin="0s" dur="20s" repeatCount="indefinite"/><animate attributeName="stroke-dashoffset" values="368;368;0;0" keyTimes="0;.55;.6;1" begin="0s" dur="20s" repeatCount="indefinite"/></path>
    <g class="endpoint-status" fill="#3FB950"><circle cx="730" cy="151" r="3.5"/><circle cx="1110" cy="151" r="3.5"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.55;.57;1" begin="0s" dur="20s" repeatCount="indefinite"/></g>
    <text class="established-text" x="920" y="167" text-anchor="middle" fill="#3FB950" font-size="14" letter-spacing=".8">ESTABLISHED<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.56;.6;1" begin="0s" dur="20s" repeatCount="indefinite"/></text>

  </g>
</svg>
