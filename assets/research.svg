<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Current research surface</title>
  <desc id="desc">Four research nodes connected through a measured data-flow trace.</desc>
  <defs><style>.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace; }</style></defs>
  <rect width="1200" height="180" rx="14" fill="#0D1117"/>
  <rect x="1" y="1" width="1198" height="178" rx="13" fill="none" stroke="#30363D"/>
  <g class="mono">
    <text x="28" y="32" fill="#8B949E" font-size="14" letter-spacing=".8">RESEARCH SURFACE / LIVE TRACE</text>
    <text x="1172" y="32" text-anchor="end" fill="#3FB950" font-size="14">4 NODES ONLINE</text>
    <path d="M126 91H390M458 91H722M790 91H1054" stroke="#30363D" stroke-width="2"/>
    <path d="M126 91H390" stroke="#D29922" stroke-width="2" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="3s" repeatCount="indefinite"/>
    </path>
    <g fill="#161B22" stroke="#8B949E">
      <circle cx="92" cy="91" r="34"/><circle cx="424" cy="91" r="34"/><circle cx="756" cy="91" r="34"/><circle cx="1088" cy="91" r="34"/>
    </g>
    <g fill="#E6EDF3" text-anchor="middle" font-size="16" font-weight="700">
      <text x="92" y="96">01</text><text x="424" y="96">02</text><text x="756" y="96">03</text><text x="1088" y="96">04</text>
    </g>
    <g fill="#8B949E" text-anchor="middle" font-size="14" letter-spacing=".4">
      <text x="92" y="148">AGENT SECURITY</text><text x="424" y="148">PROGRAM ANALYSIS</text><text x="756" y="148">EVALUATION</text><text x="1088" y="148">OFFENSIVE SECURITY</text>
    </g>
    <circle cx="92" cy="91" r="41" fill="none" stroke="#DA3633" stroke-dasharray="3 7"/>
  </g>
</svg>
