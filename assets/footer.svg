<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">L1ngSh1 AI Security Research footer</title>
  <desc id="desc">A restrained AI security research manifesto with four principles.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace; }
      .identity { fill: #E6EDF3; font-size: 25px; font-weight: 700; letter-spacing: 2px; }
      .verbs { fill: #8B949E; font-size: 18px; letter-spacing: 1.4px; }
      .manifesto { fill: #C9D1D9; font-size: 21px; font-weight: 500; }
      .copyright { fill: #6E7681; font-size: 15px; }
      @media (max-width: 600px) {
        .identity { font-size: 25px; letter-spacing: 1.2px; }
        .verbs { font-size: 19px; letter-spacing: .8px; }
        .manifesto { font-size: 24px; }
        .copyright { font-size: 18px; }
        .side-lines { display: none; }
