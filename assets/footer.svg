      }
    </style>
  </defs>
  <rect width="1200" height="280" rx="14" fill="#0D1117"/>
  <rect x="1" y="1" width="1198" height="278" rx="13" fill="none" stroke="#30363D"/>
  <path class="side-lines" d="M38 49H350M850 49h312" stroke="#30363D"/>
  <path class="side-arrows" d="M350 43l10 6-10 6M850 43l-10 6 10 6" fill="none" stroke="#DA3633" stroke-width="1.5"/>
  <g class="mono" text-anchor="middle">
    <text class="identity" x="600" y="57">L1ngSh1 /  SECURITY RESEARCH</text>
    <text class="verbs" x="600" y="92">EXPLORE · BREAK · UNCOVER · BUILD</text>
    <g class="manifesto">
