<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">GitHub telemetry console for L1ngSh1</title>
  <desc id="desc">A first-party GitHub observability console showing repositories, followers, stars, forks, yearly contributions, language composition, and activity streaks.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect width="1200" height="470" rx="14" fill="#0D1117"/>
  <rect x="1" y="1" width="1198" height="468" rx="13" fill="none" stroke="#30363D"/>
  <g class="mono">
    <text x="32" y="39" fill="#8B949E" font-size="14" letter-spacing=".8">GITHUB TELEMETRY / L1NGSH1</text>
    <circle cx="1079" cy="34" r="4" fill="#3FB950"/>
    <text x="1091" y="39" fill="#3FB950" font-size="14" letter-spacing=".8">SYNCED</text>
    <text x="1168" y="60" text-anchor="end" fill="#8B949E" font-size="13" letter-spacing=".6">AUTO-SYNC / 12H</text>
    <path d="M32 68H1168" stroke="#30363D"/>

    <g fill="#8B949E" font-size="14" letter-spacing=".4"><text x="32.0" y="102">PUBLIC REPOS</text><text x="259.2" y="102">FOLLOWERS</text><text x="486.4" y="102">STARS</text><text x="713.6" y="102">FORKS</text><text x="940.8" y="102">TOTAL CONTRIBUTIONS</text></g>
    <g fill="#E6EDF3" font-size="34" font-weight="700"><text x="32.0" y="145">8</text><text x="259.2" y="145">8</text><text x="486.4" y="145">5</text><text x="713.6" y="145">0</text><text x="940.8" y="145">511</text></g>
    <path d="M241.2 82V158 M468.4 82V158 M695.6 82V158 M922.8 82V158" stroke="#30363D"/>
    <path d="M32 180H1168" stroke="#30363D"/>

    <rect x="32" y="210" width="548" height="228" rx="8" fill="none" stroke="#30363D"/>
    <text x="54" y="242" fill="#8B949E" font-size="15" letter-spacing=".6">LANGUAGE COMPOSITION</text>
    <circle cx="160" cy="326" r="72" fill="#30363D"/>
    <path d="M160 326 L160.00 254.00 A72 72 0 1 1 146.17 396.66 Z" fill="#D29922" stroke="#0D1117" stroke-width="1.5" stroke-linejoin="round"/><path d="M160 326 L146.17 396.66 A72 72 0 0 1 88.02 327.76 Z" fill="#DA3633" stroke="#0D1117" stroke-width="1.5" stroke-linejoin="round"/><path d="M160 326 L88.02 327.76 A72 72 0 0 1 140.29 256.75 Z" fill="#3FB950" stroke="#0D1117" stroke-width="1.5" stroke-linejoin="round"/><path d="M160 326 L140.29 256.75 A72 72 0 0 1 150.23 254.67 Z" fill="#8B949E" stroke="#0D1117" stroke-width="1.5" stroke-linejoin="round"/><path d="M160 326 L150.23 254.67 A72 72 0 0 1 154.82 254.19 Z" fill="#E6EDF3" stroke="#0D1117" stroke-width="1.5" stroke-linejoin="round"/><path d="M160 326 L154.82 254.19 A72 72 0 0 1 160.00 254.00 Z" fill="#30363D" stroke="#0D1117" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="284" cy="283" r="4" fill="#D29922"/><text x="296" y="287" fill="#8B949E" font-size="15">Java <tspan fill="#E6EDF3">53%</tspan></text><circle cx="434" cy="283" r="4" fill="#DA3633"/><text x="446" y="287" fill="#8B949E" font-size="15">Python <tspan fill="#E6EDF3">22%</tspan></text><circle cx="284" cy="321" r="4" fill="#3FB950"/><text x="296" y="325" fill="#8B949E" font-size="15">HTML <tspan fill="#E6EDF3">21%</tspan></text><circle cx="434" cy="321" r="4" fill="#8B949E"/><text x="446" y="325" fill="#8B949E" font-size="15">C++ <tspan fill="#E6EDF3">2%</tspan></text><circle cx="284" cy="359" r="4" fill="#E6EDF3"/><text x="296" y="363" fill="#8B949E" font-size="15">JavaScript <tspan fill="#E6EDF3">1%</tspan></text><circle cx="434" cy="359" r="4" fill="#30363D"/><text x="446" y="363" fill="#8B949E" font-size="15">OTHER <tspan fill="#E6EDF3">1%</tspan></text>

    <rect x="604" y="210" width="564" height="228" rx="8" fill="none" stroke="#30363D"/>
    <circle cx="628" cy="238" r="4" fill="#DA3633"/>
    <text x="642" y="242" fill="#8B949E" font-size="15" letter-spacing=".6">ACTIVITY STREAK</text>
    <path d="M792 278V386M980 278V386" stroke="#30363D"/>
