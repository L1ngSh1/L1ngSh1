name: Update research dashboard

# Commits made by this workflow cannot retrigger it because only scheduled and
# manually dispatched events are enabled.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-dashboard-update
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_dashboard.py

      - name: Commit dashboard when changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- assets/research-dashboard.svg)" ]]; then
            echo "Dashboard is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/research-dashboard.svg
          git commit -m "chore: update profile dashboard"
          git push
