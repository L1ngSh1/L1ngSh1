name: Update GitHub telemetry

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-telemetry-update
  cancel-in-progress: true

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate first-party telemetry SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_github_telemetry.py

      - name: Commit telemetry only when data changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/github-telemetry.svg; then
            echo "GitHub telemetry data is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/github-telemetry.svg
          git commit -m "chore: update GitHub telemetry"
          git push
